<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        const tema = localStorage.getItem('cetatea-theme')
        const teme = ['nocturna', 'zi-de-meci', 'asediu', 'bucovina']
        if (tema && teme.includes(tema)) document.documentElement.dataset.theme = tema
      } catch {
        document.documentElement.dataset.theme = 'nocturna'
      }
    </script>
    <meta name="theme-color" content="#061126" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="Clubul suporterilor Cetatea Suceava — tribuna digitală alb-albastră."
    />
    <title>Cetatea Suceava · Tribuna digitală</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
